name: Release Application

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g., v0.1.0)'
        required: true
        default: 'v0.1.0'
      is_prerelease:
        description: 'Mark as pre-release?'
        required: false
        type: boolean
        default: false
      is_draft:
        description: 'Create as draft?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version Tag
        id: version_step
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.version }}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          echo "TAG=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Building release for version: $TAG_NAME"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew :app:testDebugUnitTest
          else
            gradle :app:testDebugUnitTest
          fi

      - name: Build Android APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug
          else
            gradle :app:assembleDebug
          fi

      - name: Package Release Assets
        run: |
          VERSION="${{ steps.version_step.outputs.TAG }}"
          mkdir -p release-artifacts
          
          # Copy APK with branded versioned name
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          DEST_APK="release-artifacts/DisciplinePlanner-${VERSION}.apk"
          
          if [ -f "$SRC_APK" ]; then
            cp "$SRC_APK" "$DEST_APK"
            echo "Successfully packaged: $DEST_APK"
          else
            echo "ERROR: APK not found at $SRC_APK"
            exit 1
          fi
          
          # Generate SHA-256 Checksum for verification
          cd release-artifacts
          sha256sum "DisciplinePlanner-${VERSION}.apk" > "DisciplinePlanner-${VERSION}.apk.sha256"
          cat "DisciplinePlanner-${VERSION}.apk.sha256"
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.TAG }}
          name: Discipline Planner ${{ steps.version_step.outputs.TAG }}
          draft: ${{ github.event.inputs.is_draft || false }}
          prerelease: ${{ github.event.inputs.is_prerelease || false }}
          generate_release_notes: true
          files: |
            release-artifacts/*.apk
            release-artifacts/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
